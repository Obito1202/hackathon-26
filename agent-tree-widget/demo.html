<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Agent Tree Widget Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    margin: 0;
    padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }
  button {
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    background: #4f46e5;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #4338ca; }
  #tree-container { margin-top: 24px; }
</style>
</head>
<body>
<h1>Agent Tree Widget Demo</h1>
<p>Click the button to render the tree client-side — no backend, no server.</p>
<button id="show-tree">Show Agent Tree</button>
<div id="tree-container"></div>

<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./tree-widget.js"></script>
<script>
  var TREE_DATA = {
    "agent-id": "agent-main",
    "children": [
      { "agent-id": "agent-research", "children": [
        { "tool-id": "tool-web-search" },
        { "tool-id": "tool-doc-parser" }
      ]},
      { "tool-id": "tool-general-assistant" }
    ]
  };

  document.getElementById("show-tree").addEventListener("click", function () {
    AgentTreeWidget.render(document.getElementById("tree-container"), TREE_DATA);
  });
</script>
</body>
</html>
